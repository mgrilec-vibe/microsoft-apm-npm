name: Publish packages

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@^11.15.0
      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          expected="v$(node --print "require('./package.json').version")"
          test "$RELEASE_TAG" = "$expected" || {
            echo "Release tag $RELEASE_TAG does not match package version $expected" >&2
            exit 1
          }
      - name: Publish package to npm
        run: |
          name="$(node --print "require('./package.json').name")"
          version="$(node --print "require('./package.json').version")"
          set +e
          output="$(npm view "${name}@${version}" version --registry=https://registry.npmjs.org 2>&1)"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "${name}@${version} is already published to npm; skipping."
          else
            case "$output" in
              *E404*|*"404 Not Found"*) npm publish --registry=https://registry.npmjs.org ;;
              *) printf '%s\n' "$output" >&2; exit "$status" ;;
            esac
          fi
      - name: Configure GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://npm.pkg.github.com
          scope: '@mgrilec'
      - name: Publish package to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          name="$(node --print "require('./package.json').name")"
          version="$(node --print "require('./package.json').version")"
          set +e
          output="$(npm view "${name}@${version}" version --registry=https://npm.pkg.github.com 2>&1)"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "${name}@${version} is already published to GitHub Packages; skipping."
          else
            case "$output" in
              *E404*|*"404 Not Found"*) npm publish --registry=https://npm.pkg.github.com ;;
              *) printf '%s\n' "$output" >&2; exit "$status" ;;
            esac
          fi
